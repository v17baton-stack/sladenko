<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<!-- НАЧАЛО ДАННЫХ: меняйте только этот блок -->
<script>
const DATA = {
  title: 'Сладко у Светы',
  subtitle: 'Домашние торты и капкейки в Москве. Готовлю с заботой для ваших сладких моментов.',
  delivery: 'Доставка по Москве',
  notice: 'Заказывайте торты за 2–3 дня',
  catalogTitle: 'Выберите что-нибудь сладкое',
  contactsTitle: 'Обсудим ваш праздник?',
  contactsText: 'Напишите мне — обсудим дату, оформление и доставку.',

  whatsapp: '+7 999 123-45-67',
  telegram: '@svetlana',

  whatsappLabel: 'Написать в WhatsApp',
  telegramLabel: 'Написать в Telegram',
  orderLabel: 'Заказать',
  orderIntro: 'Света, здравствуйте! Хочу заказать:',
  orderEnding: 'Подскажите, пожалуйста, доступную дату и условия доставки по Москве.',
  photoFallback: 'Фото скоро появится',

  products: [
    {
      name: 'Медовик',
      price: '3 500 ₽ за 2 кг',
      description: 'Классический медовик, восемь коржей.',
      photo: 'foto/medovik.jpg',
      orderLink: ''
    },
    {
      name: 'Наполеон',
      price: '3 800 ₽ за 2 кг',
      description: 'На сливочном масле.',
      photo: 'foto/napoleon.jpg',
      orderLink: ''
    },
    {
      name: 'Капкейки',
      price: '350 ₽ / шт.',
      description: 'От шести штук. Восемь вкусов.',
      photo: 'foto/cupcakes.jpg',
      orderLink: ''
    },
    {
      name: 'Бенто-торт',
      price: '1 900 ₽',
      description: 'Маленький торт. Любая надпись.',
      photo: 'foto/bento.jpg',
      orderLink: ''
    }
  ]
};
// orderLink: '' — ссылка в WhatsApp создаётся автоматически.
// При желании можно вставить свою полную ссылку https://wa.me/...
</script>
<!-- КОНЕЦ ДАННЫХ. Ниже ничего менять не нужно -->

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>Сладко у Светы</title>

<style>
:root {
  color-scheme: light;
  --bg: #fff8f1;
  --card: #fffefd;
  --ink: #49342f;
  --muted: #765f58;
  --accent: #a64260;
  --on-accent: #fff;
  --soft: #f7e5e7;
  --line: #eadbd3;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}

main {
  max-width: 640px;
  margin: auto;
  padding: 24px 18px calc(30px + env(safe-area-inset-bottom));
}

header {
  text-align: center;
  padding: 24px 4px 30px;
}

.mark {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  margin: auto auto 16px;
  border-radius: 24px;
  background: var(--soft);
  font-size: 32px;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(34px, 9vw, 48px);
  line-height: 1.15;
  margin: 0 0 16px;
}

h2 {
  font-size: 24px;
  line-height: 1.3;
  margin: 0 0 20px;
}

h3 {
  font-size: 26px;
  line-height: 1.25;
  margin: 0 0 8px;
}

p { margin: 0 0 16px; }
.muted { color: var(--muted); }

.details {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 22px;
}

.details span {
  padding: 9px 14px;
  border-radius: 16px;
  background: var(--soft);
  font-size: 16px;
}

.catalog {
  display: grid;
  gap: 24px;
}

.card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: var(--card);
  box-shadow: 0 8px 24px #49342f08;
}

.photo {
  position: relative;
  aspect-ratio: 4 / 3;
  background: var(--soft);
  display: grid;
  place-items: center;
  color: var(--muted);
  text-align: center;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
}

.photo img[hidden] { display: none; }
.photo span { padding: 24px; }
.content { padding: 22px; }

.price {
  font-size: 25px;
  font-weight: 750;
  color: var(--accent);
  margin: 16px 0;
}

.button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  padding: 14px 20px;
  background: var(--accent);
  color: var(--on-accent);
  border: 2px solid transparent;
  border-radius: 16px;
  font-size: 18px;
  font-weight: 700;
  text-decoration: none;
  text-align: center;
  touch-action: manipulation;
}

.button:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 4px;
}

.button:hover { filter: brightness(.94); }

.secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}

footer {
  margin-top: 32px;
  padding: 26px 22px;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: var(--card);
}

.contacts {
  display: grid;
  gap: 12px;
}

footer h2 { margin-bottom: 12px; }

@media (prefers-reduced-motion: no-preference) {
  .button { transition: filter .15s; }
}
</style>
</head>

<body>
<main>
  <header>
    <div class="mark" aria-hidden="true">🧁</div>
    <h1 id="title"></h1>
    <p id="subtitle" class="muted"></p>
    <div class="details">
      <span id="delivery"></span>
      <span id="notice"></span>
    </div>
  </header>

  <section aria-labelledby="catalogTitle">
    <h2 id="catalogTitle"></h2>
    <div id="catalog" class="catalog"></div>
  </section>

  <footer>
    <h2 id="contactsTitle"></h2>
    <p id="contactsText" class="muted"></p>
    <nav class="contacts" aria-label="Контакты">
      <a id="whatsapp" class="button"></a>
      <a id="telegram" class="button secondary"></a>
    </nav>
  </footer>

  <noscript>
    Для просмотра ассортимента включите JavaScript в браузере.
  </noscript>
</main>

<script>
(() => {
  const setText = (id, value) => {
    document.getElementById(id).textContent = value;
  };

  document.title = DATA.title;

  [
    'title', 'subtitle', 'delivery', 'notice',
    'catalogTitle', 'contactsTitle', 'contactsText'
  ].forEach(key => setText(key, DATA[key]));

  const phone = DATA.whatsapp.replace(/\D/g, '');
  const whatsappBase = 'https://wa.me/' + phone;

  const safeLink = value => {
    try {
      const url = new URL(value);
      return url.protocol === 'https:' ? url.href : '';
    } catch {
      return '';
    }
  };

  DATA.products.forEach(product => {
    const card = document.createElement('article');
    card.className = 'card';

    const photo = document.createElement('div');
    photo.className = 'photo';

    const fallback = document.createElement('span');
    fallback.textContent = DATA.photoFallback;
    fallback.hidden = true;

    const img = document.createElement('img');
    img.alt = product.name;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.onerror = () => {
      img.hidden = true;
      fallback.hidden = false;
    };
    img.src = product.photo;
    photo.append(fallback, img);

    const content = document.createElement('div');
    content.className = 'content';

    const title = document.createElement('h3');
    title.textContent = product.name;

    const description = document.createElement('p');
    description.className = 'muted';
    description.textContent = product.description;

    const price = document.createElement('p');
    price.className = 'price';
    price.textContent = product.price;

    const order = document.createElement('a');
    order.className = 'button';
    order.textContent = DATA.orderLabel;
    order.setAttribute(
      'aria-label',
      DATA.orderLabel + ': ' + product.name
    );

    const message =
      `${DATA.orderIntro} ${product.name} (${product.price}). ` +
      `${product.description}\n${DATA.orderEnding}`;

    order.href = safeLink(product.orderLink) ||
      whatsappBase + '?text=' + encodeURIComponent(message);

    content.append(title, description, price, order);
    card.append(photo, content);
    document.getElementById('catalog').append(card);
  });

  const wa = document.getElementById('whatsapp');
  wa.href = whatsappBase;
  wa.textContent = DATA.whatsappLabel;

  const telegram = document.getElementById('telegram');
  telegram.href = 'https://t.me/' +
    encodeURIComponent(DATA.telegram.replace(/^@/, ''));
  telegram.textContent = DATA.telegramLabel;

  let tg;
  const inTelegram = () => Boolean(tg && tg.initData);

  document.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (!link || !inTelegram()) return;

    if (
      event.ctrlKey || event.metaKey ||
      event.shiftKey || event.altKey
    ) return;

    const url = new URL(link.href);

    if (
      url.hostname === 't.me' &&
      typeof tg.openTelegramLink === 'function'
    ) {
      event.preventDefault();

      // Сначала передаём переход Telegram.
      // После close() выполнение кода может прекратиться.
      // openTelegramLink по умолчанию закрывает Mini App;
      // close() дополнительно запрашивает закрытие.
      tg.openTelegramLink(url.href);
      tg.close();
    } else if (typeof tg.openLink === 'function') {
      event.preventDefault();
      tg.openLink(url.href);
    }
  });

  function connectTelegram() {
    tg = window.Telegram && window.Telegram.WebApp;
    if (!inTelegram()) return;

    const applyTheme = () => {
      const theme = tg.themeParams || {};

      const colors = {
        bg: 'bg_color',
        card: 'secondary_bg_color',
        ink: 'text_color',
        muted: 'hint_color',
        accent: 'button_color',
        'on-accent': 'button_text_color',
        soft: 'secondary_bg_color',
        line: 'section_separator_color'
      };

      Object.entries(colors).forEach(([key, value]) => {
        document.documentElement.style.removeProperty('--' + key);

        if (/^#[0-9a-f]{6}$/i.test(theme[value] || '')) {
          document.documentElement.style.setProperty(
            '--' + key, theme[value]
          );
        }
      });

      if (tg.colorScheme === 'dark') {
        const defaults = {
          bg: '#211c20',
          card: '#30272d',
          ink: '#fff3ef',
          muted: '#d0bfc7',
          accent: '#f0a7bd',
          'on-accent': '#35202a',
          soft: '#3c2d35',
          line: '#604650'
        };

        Object.entries(defaults).forEach(([key, value]) => {
          if (!theme[colors[key]]) {
            document.documentElement.style.setProperty(
              '--' + key, value
            );
          }
        });
      }

      document.documentElement.style.colorScheme =
        tg.colorScheme === 'dark' ? 'dark' : 'light';

      document.querySelector('meta[name="theme-color"]').content =
        getComputedStyle(document.documentElement)
          .getPropertyValue('--bg').trim();
    };

    applyTheme();
    tg.onEvent('themeChanged', applyTheme);
    tg.ready();
    tg.expand();
  }

  // Единственное внешнее подключение — официальный скрипт Telegram.
  // Карточки работают и при его недоступности.
  const sdk = document.createElement('script');
  sdk.src = 'https://telegram.org/js/telegram-web-app.js';
  sdk.async = true;
  sdk.onload = connectTelegram;
  document.head.append(sdk);
})();
</script>
</body>
</html>
